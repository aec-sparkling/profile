<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blog — coming soon</title>
    <style>
      @keyframes drift {
        from { background-position: 0 0; }
        to { background-position: 200px 200px; }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #05070a;
        color: #33ff66;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-image:
          linear-gradient(rgba(51,255,102,.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(51,255,102,.06) 1px, transparent 1px);
        background-size: 24px 24px;
        animation: drift 6s linear infinite;
      }
      .card {
        text-align: center;
        padding: 2rem 3rem;
        border: 1px solid #1d8c3f;
        border-radius: 12px;
        background: #0a0e0a;
        box-shadow: 0 0 40px rgba(51,255,102,.25);
      }
      h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
      p { color: #6f8a6f; margin: .25rem 0; }
      .cursor { animation: blink 1s step-start infinite; }
      a { color: #33ff66; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>$ ./blog --init</h1>
      <p>404: witty posts not found (yet)</p>
      <p>compiling thoughts<span class="cursor">_</span></p>
      <p><a href="../">&larr; back to the terminal</a></p>
    </div>
  </body>
</html>
